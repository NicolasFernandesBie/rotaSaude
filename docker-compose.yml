services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: "4000"
      DATABASE_URL: "file:/data/rota.db"
      WHATSAPP_PROVIDER: "${WHATSAPP_PROVIDER:-simulator}"
      BAILEYS_SESSION_DIR: "/data/baileys"
      SEED_ON_START: "${SEED_ON_START:-false}"
    volumes:
      - rota-data:/data
    expose:
      - "4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    environment:
      API_URL: "http://api:4000"
    ports:
      - "3210:3210"
    depends_on:
      api:
        condition: service_healthy

volumes:
  rota-data:
